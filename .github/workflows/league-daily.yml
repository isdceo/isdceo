# AI 투자 리그 예약 작업. league/config.json 의 automation_enabled 가 true 일 때만 동작한다.
#   - 06:50 KST 평일: 공통 자료(가격 제외판) 생성
#   - 10:30 KST 월~토: 필요한 종가 수집(키 없으면 건너뜀) → 채점 → 운영자용 화면 데이터 갱신
#   - 06:30 KST 월: 지난주 주간 마감(순위·탈락·교체 고정)
# GitHub 예약 실행은 몇 분~수십 분 늦을 수 있다. 시각이 중요한 공통 자료는 마감(08:30)보다 충분히 앞에 둔다.
name: league-daily
on:
  schedule:
    - cron: '50 21 * * 0-4'   # 06:50 KST 월~금
    - cron: '30 1 * * 1-6'    # 10:30 KST 월~토
    - cron: '30 21 * * 0'     # 06:30 KST 월
  workflow_dispatch:
    inputs:
      task:
        description: 실행할 작업
        type: choice
        options: [snapshot, collect, weekly]
      target:
        description: 대상 원장 (league = 실제, league/sandbox = 연습)
        type: choice
        options: [league, league/sandbox]
      date:
        description: 공통 자료 라운드 날짜 (YYYY-MM-DD, 비우면 오늘 KST)
        required: false
      force:
        description: 자동화 스위치가 꺼져 있어도 이번 수동 실행은 진행
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: league-ledger-${{ github.ref }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q -r requirements.txt
      - name: Decide task
        id: t
        run: |
          case "${{ github.event.schedule }}" in
            '50 21 * * 0-4') T=snapshot ;;
            '30 1 * * 1-6')  T=collect ;;
            '30 21 * * 0')   T=weekly ;;
            *)               T="${{ inputs.task }}" ;;
          esac
          ON=$(python3 -c "import json;print(str(json.load(open('league/config.json')).get('automation_enabled', False)).lower())")
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then ON=true; fi
          TARGET="${{ inputs.target }}"; [ -z "$TARGET" ] && TARGET=league
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "task=$T" >> "$GITHUB_OUTPUT"; echo "on=$ON" >> "$GITHUB_OUTPUT"
          echo "작업: $T · 자동화 스위치: $ON"
      - name: Snapshot
        if: steps.t.outputs.on == 'true' && steps.t.outputs.task == 'snapshot'
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          D="${{ inputs.date }}"; [ -z "$D" ] && D=$(TZ=Asia/Seoul date +%F)
          OPEN=$(python3 -c "import sys;sys.path.insert(0,'tools');import league as L;from datetime import date;print(len(L.open_markets(date.fromisoformat('$D'),L.load_config(L.ROOT/'league'))))")
          if [ "$OPEN" = "0" ]; then echo "$D 두 시장 모두 휴장 — 라운드 없음"; exit 0; fi
          python3 tools/league.py snapshot "$D" --dir "${{ steps.t.outputs.target }}" | tee summary.txt
      - name: Collect and score
        if: steps.t.outputs.on == 'true' && steps.t.outputs.task == 'collect'
        env:
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
          TIINGO_TOKEN: ${{ secrets.TIINGO_TOKEN }}
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          python3 tools/league.py collect-due "$(TZ=Asia/Seoul date +%F)" --dir "${{ steps.t.outputs.target }}" | tee summary.txt
          if [ "${{ steps.t.outputs.target }}" = "league" ]; then python3 tools/league.py export --out data/league.js; fi
      - name: Weekly close
        if: steps.t.outputs.on == 'true' && steps.t.outputs.task == 'weekly'
        run: python3 tools/league.py weekly-close --dir "${{ steps.t.outputs.target }}" | tee summary.txt
      - name: Verify ledgers
        if: steps.t.outputs.on == 'true'
        run: python3 tools/league.py verify --dir "${{ steps.t.outputs.target }}"
      - name: Commit
        if: steps.t.outputs.on == 'true'
        run: |
          git config user.name "league-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for p in league/ledger league/rounds league/sandbox data/league.js; do [ -e "$p" ] && git add "$p"; done
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -q -m "league: ${{ steps.t.outputs.task }} $(TZ=Asia/Seoul date +'%F %H:%M') KST" -m "$(head -c 3000 summary.txt 2>/dev/null)"
          for i in 1 2 3; do
            git fetch -q origin "$GITHUB_REF_NAME" && git rebase -q "origin/$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((i * 5))
          done
          exit 1
