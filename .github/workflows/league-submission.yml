# 추천 지문(.sha256, 마감 전)·CSV(마감 뒤 공개) push → GitHub 서버 push 시각 기준 정시 판정 → 영수증(submissions.jsonl) 기록·커밋
# 판정 근거: push 이벤트 페이로드의 repository.pushed_at (서버 기록). 보조: 이 워크플로 실행의 created_at (서버 기록).
# 커밋 작성 시각(author/committer date)은 수정 가능하므로 쓰지 않는다.
name: league-submission
on:
  push:
    paths:
      - 'league/imports/*/*.csv'
      - 'league/imports/*/*.sha256'
permissions:
  contents: write
  actions: read
# 같은 그룹 대기열은 1개뿐이라 대기 중인 실행이 새 실행에 밀려 취소될 수 있다(그러면 그 push의 영수증이 빠진다).
# 그래서 제출 처리는 push마다 따로 돌리고(취소 없음), 커밋이 겹치면 최신 원장 위에서 다시 처리한다(아래 Commit receipt).
# 공유 결과 묶음(results.json) 갱신은 league-lines 워크플로가 이 작업이 끝난 뒤 공유 그룹에서 한다.
concurrency:
  group: league-submission-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -q -r requirements.txt
      - name: Server-side run timestamp
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "created_at=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }} --jq .created_at)" >> "$GITHUB_OUTPUT"
      - name: Record receipt
        run: |
          # 체크아웃은 push 시점 커밋이라 다른 실행이 막 기록한 영수증(예: 직전 지문)이 없을 수 있다 → 최신 원장에서 판정
          bash tools/receipt_retry.sh "${{ github.run_id }}" \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "${{ steps.run.outputs.created_at }}"
          echo "pushed_at(raw)=$(jq -r '.repository.pushed_at' "$GITHUB_EVENT_PATH") run_created_at=${{ steps.run.outputs.created_at }}" | tee -a receipt.txt
          { echo '### 제출 영수증'; echo '```'; cat receipt.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify ledgers
        run: |
          python3 tools/league.py verify
          python3 tools/league.py verify --dir league/sandbox
      - name: Commit receipt
        env:
          RUN_CREATED_AT: ${{ steps.run.outputs.created_at }}
        run: |
          git config user.name "league-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          receipt() {
            bash tools/receipt_retry.sh "${{ github.run_id }}" \
              "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              "$RUN_CREATED_AT" || exit 1
            python3 tools/league.py verify && python3 tools/league.py verify --dir league/sandbox || exit 1
          }
          stage() { for p in league/ledger league/sandbox; do [ -e "$p" ] && git add "$p"; done; }
          stage
          if git diff --cached --quiet; then
            # 처리한 제출이 있는데 기록할 변경이 없으면 영수증 유실 → 실패로 알린다
            if grep -qE ' (accepted|committed|late|rejected) ' receipt.txt; then echo "::error::영수증이 생성됐지만 커밋할 변경이 없음"; exit 1; fi
            echo "기록할 영수증 없음"; exit 0
          fi
          git commit -q -m "league: submission receipt for ${GITHUB_SHA::7}" -m "$(cat receipt.txt)"
          for i in 1 2 3 4 5 6; do
            git fetch -q origin "$GITHUB_REF_NAME"
            if git rebase -q "origin/$GITHUB_REF_NAME"; then
              git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0
            else
              # 다른 제출 영수증과 겹침(해시 체인 원장은 합칠 수 없음) → 최신 원장 위에서 이 push를 다시 처리한다
              git rebase --abort || true
              receipt                                  # 최신 origin 으로 맞춘 뒤 다시 판정
              stage
              if git diff --cached --quiet; then echo "다시 처리했더니 기록할 것 없음(이미 반영됨)"; exit 0; fi
              git commit -q -m "league: submission receipt for ${GITHUB_SHA::7} (재처리)" -m "$(cat receipt.txt)"
              git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0
            fi
            sleep $((i * 3))
          done
          exit 1
