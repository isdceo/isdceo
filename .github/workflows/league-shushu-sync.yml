# 슈슈 팀 전용 제출 저장소 연결 (B안). 설정: docs/shushu-repo-setup.md
# - 전용 저장소의 push를 GitHub 서버 기록 시각(activity)으로 판정해 허용 경로 파일만 메인으로 가져오고 영수증을 남긴다.
#   (메인 저장소로 들어온 뒤의 처리 시각은 판정에 쓰지 않으므로, 예약 실행이 몇 분 늦어도 정시 여부는 바뀌지 않는다)
# - 마감 전 원본·토론·대사가 든 파일은 마감 뒤까지 메인에 들이지 않는다(그 파일만 미루고 나머지는 처리).
# - 원 가격이 없는 결과 묶음·영수증·공지·검증 도구 사본을 전용 저장소 from-league/ 로 보낸다.
# - 전용 저장소의 운영 채널 이슈에 @codex 댓글로 슈슈 팀 작업을 깨운다(라운드 시작·원본 공개·지문 없음·주간 복기·마감·새 공지).
# - 슈슈 → 로로 메시지(to-roro/*.md)는 라운드 날 12:00 뒤(라운드 시간 06:50~12:00 제외)에 league/inbox/shushu/ 로 들어온다.
# 전용 저장소에는 비밀값을 두지 않는다(쓰기 권한이 있으면 워크플로로 비밀값을 빼낼 수 있음). 토큰은 메인 Secrets 에만.
name: league-shushu-sync
on:
  workflow_dispatch:
  schedule:
    - cron: '5 22 * * 0-4'      # 07:05 KST 월~금 (슈슈 라운드 시작 깨우기)
    - cron: '35 22 * * 0-4'     # 07:35 KST (깨우기 예비)
    - cron: '*/10 23 * * 0-4'   # 08:00–08:50 KST 월~금
    - cron: '*/10 0 * * 1-5'    # 09:00–09:50 KST
    - cron: '5 1-3 * * 1-5'     # 10:05·11:05·12:05 KST (채점 결과·한 줄 대사·공개 마감)
    - cron: '5 9 * * 1-5'       # 18:05 KST (늦은 대사·메시지)
    - cron: '50 1 * * 6'        # 토 10:50 KST (금요일분 채점 뒤 결과·복기 깨우기)
    - cron: '40 21 * * 0'       # 월 06:40 KST (주간 마감 뒤 결과·update-plan)
permissions:
  contents: write
# 다른 원장 작업(league-daily·league-lines)과 같은 그룹을 쓰면 대기 중인 그쪽 실행이 취소될 수 있다 → 따로 둔다.
# 메인 push가 겹치면 아래에서 최신 메인으로 처음부터 다시 처리한다.
concurrency:
  group: league-shushu-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check switch and secret
        id: gate
        env:
          TOKEN: ${{ secrets.SHUSHU_REPO_TOKEN }}
        run: |
          read -r ON REPO BR < <(python3 -c "import json;c=json.load(open('league/config.json')).get('shushu_repo') or {};print(str(c.get('enabled',False)).lower(), c.get('repo') or '-', c.get('branch') or 'main')")
          if [ "$ON" != "true" ] || [ "$REPO" = "-" ]; then echo "shushu_repo 꺼짐 — 아무것도 안 함"; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ -z "$TOKEN" ]; then echo "::error::SHUSHU_REPO_TOKEN 없음 — docs/shushu-repo-setup.md"; exit 1; fi
          echo "go=true" >> "$GITHUB_OUTPUT"; echo "repo=$REPO" >> "$GITHUB_OUTPUT"; echo "branch=$BR" >> "$GITHUB_OUTPUT"
      - if: steps.gate.outputs.go == 'true'
        run: pip install -q -r requirements.txt
      - name: Clone submission repo
        if: steps.gate.outputs.go == 'true'
        env:
          TOKEN: ${{ secrets.SHUSHU_REPO_TOKEN }}
        run: |
          set -euo pipefail
          git -c filter.lfs.smudge= -c filter.lfs.required=false clone -q --no-tags --branch "${{ steps.gate.outputs.branch }}" \
            "https://x-access-token:${TOKEN}@github.com/${{ steps.gate.outputs.repo }}.git" ext
      - name: Pull submissions and record receipts
        id: pull
        if: steps.gate.outputs.go == 'true'
        env:
          SHUSHU_REPO_TOKEN: ${{ secrets.SHUSHU_REPO_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          git config user.name "league-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BR="$GITHUB_REF_NAME"
          lines_fail=0
          run_sync() {
            python3 tools/shushu_sync.py pull --ext ext --run-id "${{ github.run_id }}" --run-url "$RUN_URL" > sync.txt
            rc=$?
            cat sync.txt
            if [ "$rc" = 3 ]; then lines_fail=1; elif [ "$rc" != 0 ]; then return 1; fi
            python3 tools/dashboard_data.py --bundle league/public/results.json || return 1
            python3 tools/league.py verify && python3 tools/league.py verify --dir league/sandbox || return 1
            for p in league/ledger league/sandbox/ledger league/public; do [ -e "$p" ] && git add "$p"; done
            git diff --cached --quiet || git commit -q -m "league: shushu repo sync receipts" -m "$(cat sync.txt)"
          }
          run_sync || exit 1
          # 리베이스하지 않는다(영수증이 가리키는 커밋이 바뀌므로). 메인이 그사이 바뀌었으면 최신 메인에서 처음부터 다시 처리
          pushed=0
          for i in 1 2 3 4 5 6; do
            git fetch -q origin "$BR"
            if [ "$(git rev-parse HEAD)" = "$(git rev-parse "origin/$BR")" ]; then pushed=1; break; fi
            if git merge-base --is-ancestor "origin/$BR" HEAD && git push -q origin "HEAD:$BR"; then pushed=1; break; fi
            sleep $((i * 4))
            git fetch -q origin "$BR" && git reset -q --hard "origin/$BR"
            lines_fail=0; run_sync || exit 1
          done
          [ "$pushed" = 1 ] || { echo "::error::메인 push 실패(6회) — 다음 실행에서 다시 처리됨"; exit 1; }
          { echo '### 슈슈 저장소 동기화'; echo '```'; cat sync.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "lines_fail=$lines_fail" >> "$GITHUB_OUTPUT"
      - name: Mirror price-free results to submission repo
        id: mirror
        if: steps.pull.outcome == 'success'
        run: |
          set -uo pipefail
          BR="${{ steps.gate.outputs.branch }}"
          cd ext
          git config user.name "league-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch -q origin "$BR" && git reset -q --hard "origin/$BR"
            (cd .. && python3 tools/shushu_sync.py mirror --ext ext) || exit 1
            git add -A from-league
            git diff --cached --quiet && { echo "사본 변경 없음"; exit 0; }
            git commit -q -m "from-league: 메인 리그 자료 사본 (${GITHUB_SHA::7})"
            git push -q origin "HEAD:$BR" && exit 0
            sleep $((i * 5))
          done
          exit 1
      - name: Wake 슈슈 team (@codex comments)
        if: steps.pull.outcome == 'success'
        env:
          SHUSHU_REPO_TOKEN: ${{ secrets.SHUSHU_REPO_TOKEN }}
        run: |
          set -uo pipefail
          BR="$GITHUB_REF_NAME"
          for i in 1 2 3 4; do
            git fetch -q origin "$BR" && git reset -q --hard "origin/$BR"
            python3 tools/shushu_sync.py wake --ext ext > wake.txt; rc=$?; cat wake.txt
            [ "$rc" = 0 ] || { echo "::error::깨우기 실패 — 토큰의 Issues 쓰기 권한과 채널 이슈를 확인"; exit 1; }
            git add league/ledger
            git diff --cached --quiet && exit 0
            git commit -q -m "league: shushu wake log" -m "$(cat wake.txt)"
            git push -q origin "HEAD:$BR" && exit 0
            sleep $((i * 4))          # 다시 돌아도 채널 댓글의 표식으로 같은 깨우기는 다시 달지 않는다
          done
          exit 1
      - name: Report line check
        if: steps.pull.outputs.lines_fail == '1'
        run: echo "::error::한 줄 대사 검사 실패 — 위 동기화 출력 확인(묶음에서는 자동으로 걸러짐)"; exit 1
