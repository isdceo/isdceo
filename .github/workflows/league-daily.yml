# AI 투자 리그 예약 작업. league/config.json 의 automation_enabled 가 true 일 때만 동작한다.
#   - 06:50 KST 평일: 공통 자료(가격 제외판) 생성
#   - 08:35 KST 월~금: 전날 라운드 수집·채점(08:45 배포에 오늘 종목과 전날 점수를 함께 싣기 위해, 운영자 결정 2026-11-09). 08:30 마감 뒤라 지문 제출과 겹치지 않음
#   - 10:30 KST 월~토: 필요한 종가 수집(키 없으면 건너뜀) → 채점 → 운영자용 화면 데이터 갱신 (08:35에 덜 끝난 것 예비 처리, 토요일은 금요일 라운드)
#   - 06:30 KST 월: 지난주 주간 마감(순위·탈락·교체 고정)
# GitHub 예약 실행은 몇 분~수십 분 늦을 수 있다. 시각이 중요한 공통 자료는 마감(08:30)보다 충분히 앞에 둔다.
name: league-daily
on:
  schedule:
    - cron: '50 21 * * 0-4'   # 06:50 KST 월~금
    - cron: '35 23 * * 0-4'   # 08:35 KST 월~금 (전날 라운드 채점)
    - cron: '30 1 * * 1-6'    # 10:30 KST 월~토
    - cron: '30 21 * * 0'     # 06:30 KST 월
  workflow_dispatch:
    inputs:
      task:
        description: 실행할 작업
        type: choice
        options: [snapshot, collect, weekly]
      target:
        description: 대상 원장 (league = 실제, league/sandbox = 연습)
        type: choice
        options: [league, league/sandbox]
      date:
        description: 공통 자료 라운드 날짜 (YYYY-MM-DD, 비우면 오늘 KST)
        required: false
      force:
        description: 자동화 스위치가 꺼져 있어도 이번 수동 실행은 진행
        type: boolean
        default: false
permissions:
  contents: write
  actions: write          # 06:50 공통 자료 직후 슈슈 저장소 동기화를 바로 부르기 위해
concurrency:
  group: league-ledger-${{ github.ref }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -q -r requirements.txt
      - name: Decide task
        id: t
        run: |
          case "${{ github.event.schedule }}" in
            '50 21 * * 0-4') T=snapshot ;;
            '35 23 * * 0-4') T=collect ;;
            '30 1 * * 1-6')  T=collect ;;
            '30 21 * * 0')   T=weekly ;;
            *)               T="${{ inputs.task }}" ;;
          esac
          ON=$(python3 -c "import json;print(str(json.load(open('league/config.json')).get('automation_enabled', False)).lower())")
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then ON=true; fi
          TARGET="${{ inputs.target }}"; [ -z "$TARGET" ] && TARGET=league
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "task=$T" >> "$GITHUB_OUTPUT"; echo "on=$ON" >> "$GITHUB_OUTPUT"
          echo "작업: $T · 자동화 스위치: $ON"
      - name: Snapshot
        if: steps.t.outputs.on == 'true' && steps.t.outputs.task == 'snapshot'
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          D="${{ inputs.date }}"; [ -z "$D" ] && D=$(TZ=Asia/Seoul date +%F)
          OPEN=$(python3 -c "import sys;sys.path.insert(0,'tools');import league as L;from datetime import date;print(len(L.open_markets(date.fromisoformat('$D'),L.load_config(L.ROOT/'league'))))")
          if [ "$OPEN" = "0" ]; then echo "$D 두 시장 모두 휴장 — 라운드 없음"; exit 0; fi
          # 월요일: 06:30 주간 마감이 늦거나 빠졌으면 여기서 먼저 마감한다(이미 마감했으면 아무것도 하지 않음).
          # 07:05 라운드가 새 명단(리그별 탈락·합류)으로 검사되게 하기 위해서다.
          if [ "$(TZ=Asia/Seoul date -d "$D" +%u)" = "1" ]; then
            python3 tools/league.py weekly-close --dir "${{ steps.t.outputs.target }}" | tee weekly.txt
          fi
          # 라운드 세션(07:05)이 늦은 이 작업을 기다리지 못하고 공통 자료를 먼저 올렸으면 그 판을 그대로 쓴다(다시 만들면 해시가 바뀜)
          RP="${{ steps.t.outputs.target }}/rounds/$D"
          git fetch -q origin "$GITHUB_REF_NAME" || true
          if git cat-file -e "origin/$GITHUB_REF_NAME:$RP/snapshot.json" 2>/dev/null; then
            git checkout -q "origin/$GITHUB_REF_NAME" -- "$RP"
            echo "$D 공통 자료가 이미 저장소에 있음(라운드 세션이 먼저 올림) — 다시 만들지 않음" | tee summary.txt
          else
            python3 tools/league.py snapshot "$D" --dir "${{ steps.t.outputs.target }}" | tee summary.txt
          fi
          [ -f weekly.txt ] && cat weekly.txt >> summary.txt || true
      - name: Collect and score
        if: steps.t.outputs.on == 'true' && steps.t.outputs.task == 'collect'
        env:
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          TIINGO_TOKEN: ${{ secrets.TIINGO_TOKEN }}
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          python3 tools/league.py collect-due "$(TZ=Asia/Seoul date +%F)" --dir "${{ steps.t.outputs.target }}" | tee summary.txt
          if [ "${{ steps.t.outputs.target }}" = "league" ]; then
            python3 tools/league.py export --out data/league.js
            # 두 팀 공유 결과 묶음(results.json)은 여기서 만들지 않는다 — 아래에서 league-lines를 불러 갱신(같은 파일 충돌·대기열 취소 방지)
          fi
      - name: Weekly close
        if: steps.t.outputs.on == 'true' && steps.t.outputs.task == 'weekly'
        run: python3 tools/league.py weekly-close --dir "${{ steps.t.outputs.target }}" | tee summary.txt
      - name: Verify ledgers
        if: steps.t.outputs.on == 'true'
        run: python3 tools/league.py verify --dir "${{ steps.t.outputs.target }}"
      - name: Commit
        if: steps.t.outputs.on == 'true'
        run: |
          git config user.name "league-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for p in league/ledger league/rounds league/sandbox league/public data/league.js; do [ -e "$p" ] && git add "$p"; done
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -q -m "league: ${{ steps.t.outputs.task }} $(TZ=Asia/Seoul date +'%F %H:%M') KST" -m "$(head -c 3000 summary.txt 2>/dev/null)"
          D="${{ inputs.date }}"; [ -z "$D" ] && D=$(TZ=Asia/Seoul date +%F); RP="${{ steps.t.outputs.target }}/rounds/$D"
          for i in 1 2 3; do
            git fetch -q origin "$GITHUB_REF_NAME" || true
            if [ "${{ steps.t.outputs.task }}" = "snapshot" ] && git cat-file -e "origin/$GITHUB_REF_NAME:$RP/snapshot.json" 2>/dev/null; then
              # 그사이 라운드 세션이 같은 날 공통 자료를 올렸으면 그 판을 채택(덮어쓰기·add/add 충돌 방지)
              git checkout -q "origin/$GITHUB_REF_NAME" -- "$RP" && git commit -q --amend --no-edit --allow-empty
            fi
            git rebase -q "origin/$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          exit 1
      - name: Refresh shared results bundle (league-lines)
        if: steps.t.outputs.on == 'true' && steps.t.outputs.target == 'league' && (steps.t.outputs.task == 'collect' || steps.t.outputs.task == 'weekly')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run league-lines.yml --ref "$GITHUB_REF_NAME" || echo "::warning::league-lines 호출 실패 — 다음 제출·대사 때 갱신"
      - name: Send common data to 슈슈 repo right away
        if: steps.t.outputs.on == 'true' && steps.t.outputs.task == 'snapshot' && steps.t.outputs.target == 'league'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 슈슈 팀 라운드(07:05) 전에 가격 제외 공통 자료가 전용 저장소 from-league/ 에 도착하도록 동기화를 바로 실행
          ON=$(python3 -c "import json;print(str((json.load(open('league/config.json')).get('shushu_repo') or {}).get('enabled', False)).lower())")
          [ "$ON" = "true" ] || { echo "shushu_repo 꺼짐"; exit 0; }
          gh workflow run league-shushu-sync.yml --ref "$GITHUB_REF_NAME" || echo "::warning::슈슈 동기화 호출 실패 — 06:57 예약 실행이 보냄"
