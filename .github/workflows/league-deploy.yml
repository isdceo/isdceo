# 공유판 배포 (Cloudflare Pages + 비밀번호 잠금). 원시 가격이 없는 공유판(build-site)만 올린다.
# 켜는 조건: league/config.json 의 deploy_enabled 가 true, 그리고 저장소 Secrets 에
#   CLOUDFLARE_API_TOKEN (권한: Cloudflare Pages Edit), CLOUDFLARE_ACCOUNT_ID 가 있고,
#   Pages 프로젝트 설정에 SITE_PASSWORD(비밀 유형)가 있을 것.
# 설정 방법: docs/deploy-cloudflare.md
name: league-deploy
on:
  workflow_dispatch:
  schedule:
    - cron: '45 23 * * 0-4'   # 08:45 KST 월~금 (두 팀 원본 접수 직후 — 종목 동시 공개)
    - cron: '15 0 * * 1-5'    # 09:15 KST 월~금 (원본 접수가 늦은 날)
    - cron: '0 2 * * 1-6'     # 11:00 KST 월~토 (10:30 수집·채점 뒤)
    - cron: '10 3 * * 1-5'    # 12:10 KST 월~금 (원본 공개 마감 뒤)
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check switch and secrets
        id: gate
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ON=$(python3 -c "import json;print(str(json.load(open('league/config.json')).get('deploy_enabled', False)).lower())")
          if [ "$ON" != "true" ]; then echo "deploy_enabled=false — 배포 안 함"; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then echo "::warning::Cloudflare Secrets 없음 — 배포 안 함"; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "go=true" >> "$GITHUB_OUTPUT"
      - name: Check password lock is configured (refuse to deploy an open site)
        if: steps.gate.outputs.go == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 잠금 코드 시험 + Pages 프로젝트에 SITE_PASSWORD(비밀)가 있는지 확인. 없으면 배포하지 않는다.
          node tests/test_site_lock.mjs
          PROJECT=$(python3 -c "import json;print(json.load(open('league/config.json')).get('cloudflare_project', 'isdceo-league'))")
          # 원인 확인용: 토큰 상태와 Cloudflare 오류 메시지만 보여 준다(값은 출력하지 않음)
          V=$(curl -s -o verify.json -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/user/tokens/verify")
          echo "토큰 확인(user): HTTP $V $(python3 -c "import json;d=json.load(open('verify.json'));print((d.get('result') or {}).get('status'), [e.get('message') for e in d.get('errors',[])])" 2>/dev/null)"
          V=$(curl -s -o verify.json -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify")
          echo "토큰 확인(account): HTTP $V $(python3 -c "import json;d=json.load(open('verify.json'));print((d.get('result') or {}).get('status'), [e.get('message') for e in d.get('errors',[])])" 2>/dev/null)"
          rm -f verify.json
          H=$(curl -s -o project.json -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT")
          if [ "$H" != "200" ]; then
            echo "::error::Cloudflare Pages 프로젝트 $PROJECT 를 읽지 못함(HTTP $H) — 배포 안 함"
            python3 -c "import json;d=json.load(open('project.json'));[print('  Cloudflare:', e.get('code'), e.get('message')) for e in d.get('errors',[])]" 2>/dev/null || true
            echo "  확인할 것: 토큰 권한 '계정 > Cloudflare Pages > 편집', 계정 리소스에 이 계정 포함, CLOUDFLARE_ACCOUNT_ID 값(32자 계정 ID), 앞뒤 공백"
            rm -f project.json; exit 1
          fi
          python3 - <<'PY'
          import json, sys
          r = json.load(open("project.json"))["result"]
          ev = (((r.get("deployment_configs") or {}).get("production") or {}).get("env_vars") or {})
          pw = ev.get("SITE_PASSWORD")
          if not pw:
              print("::error::Pages 프로젝트 설정에 SITE_PASSWORD 가 없음 — 배포 안 함 (docs/deploy-cloudflare.md 0장)"); sys.exit(1)
          if pw.get("type") != "secret_text":
              print("::error::SITE_PASSWORD 가 '비밀(암호화)' 유형이 아님 — 배포 안 함"); sys.exit(1)
          print("잠금 비밀번호 설정 확인:", r.get("subdomain"))
          PY
          rm -f project.json
      - if: steps.gate.outputs.go == 'true'
        run: pip install -q -r requirements.txt
      - name: Build public site (no raw prices)
        if: steps.gate.outputs.go == 'true'
        run: python3 tools/league.py build-site --out site
      - name: Deploy to Cloudflare Pages
        if: steps.gate.outputs.go == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          PROJECT=$(python3 -c "import json;print(json.load(open('league/config.json')).get('cloudflare_project', 'isdceo-league'))")
          # 잠금 함수(functions/_middleware.js)를 사이트와 함께 올린다
          rm -rf deploy && mkdir deploy && cp -r site deploy/site && cp -r league/site-functions deploy/functions
          cd deploy && npx --yes wrangler@4 pages deploy site --project-name "$PROJECT" --branch main --commit-dirty=true 2>&1 | tee ../deploy.log
          test "${PIPESTATUS[0]}" -eq 0
      - name: Verify the site asks for a password (roll back to a locked deployment if not)
        if: always() && steps.gate.outputs.go == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          PROJECT=$(python3 -c "import json;print(json.load(open('league/config.json')).get('cloudflare_project', 'isdceo-league'))")
          python3 tools/pages_guard.py verify --project "$PROJECT" --deploy-log deploy.log
