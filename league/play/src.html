<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#120a1c"><meta name="format-detection" content="telephone=no">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>AI 투자 리그</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{--disp:"Do Hyeon",system-ui,sans-serif;--body:"Noto Sans KR",system-ui,sans-serif;--gold:#ffd77a;--ink:#fff7e6;--px:0;--py:0}
*{box-sizing:border-box}
html,body{margin:0;height:100%;height:100dvh;overflow:hidden;overscroll-behavior:none;background:#0d0716;color:var(--ink);font-family:var(--body);-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,.who,.plate,.pair,.big,.row{touch-action:manipulation}
.game{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.sheet .body{-webkit-user-select:text;user-select:text}
.game{position:fixed;inset:0;overflow:hidden}
.game::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:15;mix-blend-mode:soft-light;background:linear-gradient(180deg,rgba(255,190,110,.4),rgba(60,0,90,.3))}

/* 배경: 흐릿한 카지노 홀 */
.room{position:absolute;inset:-6%;filter:blur(7px) saturate(1.25);transform:scale(1.06) translate(calc(var(--px)*-12px),calc(var(--py)*-6px));transition:transform .4s ease-out}
.room .wall{position:absolute;inset:0;background:
  radial-gradient(60% 45% at 50% 6%,#ffcf8a 0%,#c06a3a 18%,rgba(90,30,80,0) 55%),
  radial-gradient(40% 50% at 8% 55%,rgba(0,220,210,.55),rgba(0,0,0,0) 70%),
  radial-gradient(38% 50% at 93% 50%,rgba(0,230,200,.5),rgba(0,0,0,0) 70%),
  radial-gradient(30% 30% at 25% 30%,rgba(255,80,170,.45),rgba(0,0,0,0) 70%),
  radial-gradient(30% 30% at 76% 28%,rgba(255,110,60,.45),rgba(0,0,0,0) 70%),
  linear-gradient(180deg,#3a1846 0%,#2a1440 40%,#1b0f2c 70%,#120a1c 100%)}
.room .slot{position:absolute;border-radius:10px;background:linear-gradient(180deg,#5ef2ff,#0fa6b8 40%,#13304a 41%,#0b1a2a);box-shadow:0 0 40px 10px rgba(60,240,255,.45)}
.room .slot.pk{background:linear-gradient(180deg,#ff8ad8,#d03e9a 40%,#3a1430 41%,#1a0a18);box-shadow:0 0 40px 10px rgba(255,90,190,.45)}
.room .bk{position:absolute;border-radius:50%;mix-blend-mode:screen;animation:drift 9s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(14px,-9px)}}
.room .lamp{position:absolute;border-radius:50%;background:radial-gradient(circle,#fff3c4,#ffb44a 45%,rgba(255,150,40,0) 70%)}
.vign{position:absolute;inset:0;pointer-events:none;z-index:14;background:radial-gradient(120% 90% at 50% 40%,rgba(0,0,0,0) 55%,rgba(5,0,12,.7) 100%)}

/* 로비: 테이블 단(가로 1단, 세로 2단) */
.lobby{position:absolute;inset:0}
.tier{position:absolute;left:0;right:0}
.cast{position:absolute;left:0;right:0;bottom:33%;height:68%;pointer-events:none;z-index:2;transform:translateX(calc(var(--px)*7px));transition:transform .4s ease-out}
.who{position:absolute;bottom:0;width:var(--w);height:var(--w);cursor:pointer;border:0;padding:0;background:none;pointer-events:none;
  transform:translateX(-50%);animation:idle 3.2s ease-in-out infinite;animation-delay:calc(var(--i)*-.37s)}
@keyframes idle{50%{transform:translateX(-50%) translateY(-1.5%) scale(1.012)}}
.who.front .fig{transform:translateY(4%) scale(1.06)}
.who .fig{position:absolute;inset:0;filter:drop-shadow(0 0 5px rgba(120,230,255,.45)) drop-shadow(0 12px 14px rgba(0,0,0,.6))}
.who img,.who svg{width:100%;height:100%;display:block;pointer-events:none}
.who.flat svg{transform:scale(.8) translateY(10%);clip-path:circle(44% at 50% 48%)}
.who.flat .fig{-webkit-mask-image:linear-gradient(#000 72%,transparent 96%);mask-image:linear-gradient(#000 72%,transparent 96%)}
.who::after{content:"";position:absolute;left:14%;right:14%;bottom:-2%;height:10%;border-radius:50%;background:radial-gradient(rgba(0,0,0,.65),transparent 70%)}
.who .glow{position:absolute;left:10%;right:10%;bottom:6%;height:34%;border-radius:50%;filter:blur(16px);opacity:0}
.who.lead .glow{background:#5dff8c;opacity:.6}.who.risk .glow{background:#ff4d4d;opacity:.6}
.who:focus-visible{outline:3px solid #ffd77a;outline-offset:-6px;border-radius:20px}
.teamtag{position:absolute;z-index:8;transform:translateX(-50%);font-family:var(--disp);font-size:clamp(14px,2.3vw,22px);letter-spacing:.06em;padding:.15em .9em;border-radius:999px;
  background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.04));border:1.5px solid rgba(255,255,255,.35);text-shadow:0 2px 0 rgba(0,0,0,.35);white-space:nowrap}
.teamtag.c{color:#ffc58a;box-shadow:0 0 24px rgba(255,140,60,.35)}.teamtag.s{color:#9fd0ff;box-shadow:0 0 24px rgba(80,160,255,.35)}

.table{position:absolute;left:-25%;right:-25%;bottom:0;height:41%;z-index:3}
.rail{position:absolute;left:0;right:0;top:0;height:17%;border-radius:50% 50% 0 0/100% 100% 0 0;
  background:linear-gradient(180deg,#e7ad74 0%,#b0652e 20%,#6e3514 62%,#3c1a08 100%);
  box-shadow:inset 0 4px 3px rgba(255,232,195,.7),inset 0 -8px 12px rgba(0,0,0,.55),0 12px 22px rgba(0,0,0,.6)}
.rail::after{content:"";position:absolute;left:18%;right:18%;top:12%;height:20%;border-radius:50%;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,245,220,.6),rgba(255,255,255,0));filter:blur(2px)}
.felt{position:absolute;left:0;right:0;top:14%;bottom:0;overflow:hidden;border-radius:50% 50% 0 0/26% 26% 0 0;
  background:radial-gradient(28% 40% at 50% 22%,rgba(255,226,150,.32),transparent 70%),radial-gradient(60% 90% at 50% 0%,#33ad60 0%,#1d7c41 45%,#0c4423 100%)}
.felt::before,.close .felt2::before{content:"";position:absolute;inset:0;opacity:.35;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='.9'/></svg>")}
.print{position:absolute;left:50%;top:9%;width:52%;height:110%;transform:translateX(-50%) perspective(500px) rotateX(52deg);transform-origin:50% 0;pointer-events:none}
.print .arc{position:absolute;inset:0;border:2px solid rgba(255,215,120,.5);border-radius:50% 50% 0 0/30% 30% 0 0;border-bottom:0}
.print .mid{position:absolute;left:50%;top:6%;transform:translateX(-50%);font-family:var(--disp);font-size:clamp(13px,2.1vw,20px);color:rgba(255,240,200,.75);letter-spacing:.15em;white-space:nowrap}

.spots{position:absolute;inset:0;pointer-events:none;z-index:6}
.pair{position:absolute;display:flex;gap:3px;pointer-events:auto;cursor:pointer;transform-origin:50% 100%}
.mini{width:var(--cw,clamp(20px,3.2vw,34px));aspect-ratio:5/7;border-radius:4px;background:
  repeating-linear-gradient(45deg,rgba(255,215,120,.35) 0 2px,transparent 2px 6px),
  repeating-linear-gradient(-45deg,rgba(255,215,120,.35) 0 2px,transparent 2px 6px),#9b1c24;
  border:2px solid #fff3dc;box-shadow:0 2px 0 rgba(0,0,0,.35),0 10px 12px rgba(0,0,0,.45);display:grid;place-items:center;color:#ffd77a;font-size:clamp(9px,1.4vw,14px)}
.mini:nth-child(2){transform:rotate(9deg) translateY(-6%)}
.mini.none{background:rgba(255,255,255,.08);border:1.5px dashed rgba(255,255,255,.4);box-shadow:none}
.chips{position:absolute;pointer-events:none}
.chip{position:absolute;width:var(--d);height:calc(var(--d)*.42);border-radius:50%;transform:translateX(-50%)}
.chip i{position:absolute;left:0;right:0;height:100%;border-radius:50%;background:radial-gradient(circle at 50% 50%,#fff 0 18%,var(--c) 19% 62%,#fff 63% 70%,var(--c) 71%);
  box-shadow:0 2px 0 var(--e),0 3px 0 rgba(0,0,0,.35)}
.chips.top i{animation:shine 4s ease-in-out infinite}
@keyframes shine{50%{filter:brightness(1.25)}}
.chip.blur{filter:blur(3.5px)}

.plates{position:absolute;left:0;right:0;bottom:35%;height:0;z-index:7}
.plate{position:absolute;transform:translate(-50%,-50%) perspective(300px) rotateX(22deg);padding:.12em .55em .16em;border-radius:7px;text-align:center;line-height:1.05;cursor:pointer;border:0;
  font-family:var(--disp);font-size:var(--pf,clamp(10px,1.45vw,15px));white-space:nowrap;color:#2a1606;
  background:linear-gradient(180deg,#fbe6a8,#d4a84a 55%,#a8761f);box-shadow:0 3px 0 #6e4a10,0 6px 10px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.8)}
.plate small{display:block;font-size:max(11px,.86em)}
.plate .up{color:#0f6b32}.plate .dn{color:#a3241c}.plate .no{color:#6b5a3a}
.plate::before{content:"";position:absolute;left:-5px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:var(--tc);box-shadow:0 0 6px var(--tc)}
.plate.c{--tc:#ff8a3a}.plate.s{--tc:#4ea2ff}
.plate.lead{box-shadow:0 3px 0 #6e4a10,0 0 14px 3px #5dff8c}.plate.risk{box-shadow:0 3px 0 #6e4a10,0 0 14px 3px #ff5c5c}

/* HUD · 메뉴(칩 모양 버튼) */
.hud{position:absolute;z-index:9;top:max(8px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));display:flex;justify-content:space-between;align-items:center;gap:8px;pointer-events:none;transition:opacity .2s}
.logo{font-family:var(--disp);font-size:clamp(18px,3vw,28px);color:var(--gold);text-shadow:0 2px 0 #7a3a10,0 0 18px rgba(255,190,90,.6);white-space:nowrap}
.timer{pointer-events:auto;cursor:pointer;border:2px solid #ffcf6a;color:var(--ink);font-family:var(--disp);font-size:clamp(12px,1.9vw,18px);padding:.3em 1em;border-radius:999px;white-space:nowrap;
  background:linear-gradient(180deg,rgba(40,20,60,.85),rgba(15,8,25,.85));box-shadow:0 0 18px rgba(255,190,80,.35),inset 0 1px 0 rgba(255,255,255,.25)}
.timer b{color:#ffd77a;font-size:1.2em;font-weight:400;margin-left:.3em}
.dock{position:absolute;z-index:9;right:max(8px,env(safe-area-inset-right));top:54%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px}
.btn{font-family:var(--disp);color:#fff;cursor:pointer;border:0;padding:0}
.chipbtn{width:clamp(46px,7.4vw,70px);aspect-ratio:1;border-radius:50%;font-size:clamp(11px,1.6vw,15px);text-shadow:0 1px 0 rgba(0,0,0,.6);
  background:radial-gradient(circle,var(--c) 0 52%,#fff 53% 57%,var(--c) 58% 72%,transparent 73%),repeating-conic-gradient(#fff 0 12deg,var(--c) 12deg 45deg);
  box-shadow:0 4px 0 var(--e),0 8px 12px rgba(0,0,0,.5),inset 0 0 0 2px rgba(255,255,255,.4)}
.chipbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--e),0 4px 8px rgba(0,0,0,.5)}
.chipbtn:focus-visible,.timer:focus-visible,.x:focus-visible,.act:focus-visible{outline:3px solid #fff;outline-offset:3px}
.fine{position:absolute;z-index:9;left:0;right:0;bottom:3px;text-align:center;font-size:10px;color:rgba(255,255,255,.8);text-shadow:0 1px 2px #000;transition:opacity .2s;pointer-events:none}

/* 쪼이기 클로즈업 */
.close{position:absolute;inset:0;display:none;z-index:20}
.game.zoomed .room,.game.sheeted .room{filter:blur(14px) saturate(1.2) brightness(.65)}
.game.zoomed .lobby,.game.zoomed .dock,.game.sheeted .lobby,.game.sheeted .dock{filter:blur(6px) brightness(.5);pointer-events:none}
.game.zoomed .hud,.game.zoomed .fine{opacity:0;pointer-events:none}
.game.zoomed .close{display:block}
.close .rail2{position:absolute;left:-8%;right:-8%;bottom:41%;height:8%;z-index:2;border-radius:50% 50% 0 0/100% 100% 0 0;
  background:linear-gradient(180deg,#e7ad74,#b0652e 22%,#6e3514 62%,#3c1a08);box-shadow:inset 0 3px 2px rgba(255,232,195,.7),0 10px 18px rgba(0,0,0,.6)}
.close .felt2{position:absolute;left:-8%;right:-8%;bottom:0;height:42%;z-index:2;overflow:hidden;background:radial-gradient(30% 50% at 62% 30%,rgba(255,226,150,.25),transparent),radial-gradient(45% 90% at 68% 0%,rgba(255,226,150,.3),transparent 70%),radial-gradient(60% 120% at 50% 0%,#2fa35a,#0f4f28)}
.close .fz{position:absolute;z-index:3;filter:blur(4px);pointer-events:none}
.close .hero{position:absolute;left:2%;bottom:43%;height:57%;aspect-ratio:1;z-index:1;filter:drop-shadow(0 0 8px rgba(120,230,255,.4)) drop-shadow(0 18px 24px rgba(0,0,0,.6));animation:pop .35s ease-out both}
.close .hero img,.close .hero svg{width:100%;height:100%}
.close .hero.flat svg{transform:scale(.85) translateY(8%)}
@keyframes pop{from{transform:translateY(16px) scale(.92);opacity:0}to{transform:none;opacity:1}}
.close .name2{position:absolute;left:3%;bottom:22%;z-index:3;font-family:var(--disp);font-size:clamp(17px,2.7vw,28px);text-shadow:0 2px 0 #000}
.close .name2 small{display:block;font-size:.6em;color:#e3ecff;font-family:var(--body)}
.cards{position:absolute;left:34%;right:12%;bottom:1%;height:42%;gap:5%;z-index:3;display:flex;justify-content:center;align-items:flex-end;perspective:520px}
.slot2{position:relative;width:min(31%,175px);margin-top:10px;display:flex;flex-direction:column;align-items:center}
.big{position:relative;width:100%;aspect-ratio:5/7;transform:rotateX(46deg) rotateZ(var(--rz,-4deg));transform-origin:50% 100%;cursor:grab;touch-action:none;animation:deal .45s ease-out both;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.slot2:nth-child(2) .big{--rz:5deg;animation-delay:.12s}
@keyframes deal{from{transform:translate(-40px,-60px) rotateX(46deg) rotateZ(-20deg);opacity:0}to{transform:rotateX(46deg) rotateZ(var(--rz,-4deg));opacity:1}}
.big .face,.big .back,.big .flap{position:absolute;inset:0;border-radius:10px}
.big .face{background:linear-gradient(160deg,#fffdf7,#efe7d6);border:1px solid #d8cfbb;box-shadow:0 2px 0 rgba(0,0,0,.25),0 18px 22px rgba(0,0,0,.55);color:#1f1a14}
.big .mk{position:absolute;font-family:var(--disp);font-size:clamp(14px,2.2vw,22px);line-height:.95;text-align:center}
.big .mk.tl{left:7%;top:5%}.big .mk.br{right:5%;bottom:3%;transform:rotate(180deg);font-size:clamp(10px,1.5vw,16px)}
.big .mk.r{color:#c0392b}
.big .sc{opacity:0;position:absolute;left:4%;right:22%;top:62%;text-align:center;font-family:var(--disp);font-size:clamp(15px,2.6vw,28px)}
.big .sc.on{opacity:1;animation:scorePop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes scorePop{from{transform:scale(1.7);opacity:0}}
.big.won .face{animation:flash .7s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(255,215,120,.9)}100%{box-shadow:0 0 0 18px rgba(255,215,120,0)}}
/* 공개 손맛: 점수 크기에 따라 흔들림·빛·큰 움직임 연출 */
.big.shake{animation:cardShake .42s cubic-bezier(.36,.07,.19,.97) both}
@keyframes cardShake{20%,80%{transform:rotateX(46deg) rotateZ(var(--rz,-4deg)) translateX(-3px)}40%,60%{transform:rotateX(46deg) rotateZ(var(--rz,-4deg)) translateX(4px)}}
.big.glow-up .face{box-shadow:0 0 0 3px #ffd77a,0 0 26px 8px rgba(255,215,120,.75),0 18px 22px rgba(0,0,0,.55)}
.big.glow-down .face{box-shadow:0 0 0 3px #ff8a7a,0 0 26px 8px rgba(255,90,80,.6),0 18px 22px rgba(0,0,0,.55)}
.big .rays{position:absolute;left:50%;top:50%;width:260%;aspect-ratio:1;transform:translate(-50%,-50%);z-index:-1;pointer-events:none;border-radius:50%;opacity:0;
  background:radial-gradient(circle,rgba(255,226,140,.55),rgba(255,226,140,0) 58%)}
.big.huge .rays{opacity:.8;animation:halo .9s ease-out 1 both}
.big.huge.down .rays{background:radial-gradient(circle,rgba(255,130,120,.5),rgba(255,130,120,0) 58%)}
@keyframes halo{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}45%{opacity:1}100%{opacity:.8;transform:translate(-50%,-50%) scale(1)}}
.bubble b em{font-style:normal;margin-right:.35em;padding:0 .4em;border-radius:6px;background:#ffd77a;color:#5a2a00}
.bubble b em.dn{background:#ffc2b8;color:#7a1a10}
/* 캐릭터 반응 */
.close .hero.cheer{animation:pop .35s ease-out both,cheer .5s ease-out .35s 3}
@keyframes cheer{50%{transform:translateY(-6%) scale(1.03)}}
.close .hero.slump{animation:pop .35s ease-out both,slump 1.2s ease-in-out .35s both}
@keyframes slump{30%{transform:rotate(-3deg) translateY(2%)}60%{transform:rotate(2deg) translateY(3%)}100%{transform:translateY(3%)}}
.close .hero.shrug{animation:pop .35s ease-out both,shrug .7s ease-in-out .35s 2}
@keyframes shrug{50%{transform:translateY(-2%) rotate(1.5deg)}}
.react{position:absolute;left:50%;top:10%;z-index:6;pointer-events:none;white-space:nowrap;max-width:96%;overflow:hidden;font-family:var(--disp);font-size:clamp(16px,2.6vw,28px);
  padding:.1em .6em;border-radius:999px;background:rgba(20,10,30,.6);text-shadow:0 2px 0 rgba(0,0,0,.4);animation:reactUp 1.4s ease-out both}
.react.up{color:#ffe27a}.react.dn{color:#9fd8ff}.react.eq{color:#fff}
@keyframes reactUp{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}20%{opacity:1;transform:translateX(-50%)}80%{opacity:1;transform:translateX(-50%)}100%{opacity:0;transform:translate(-50%,-24px)}}
/* 누를 때 눌림 */
.plate:active,.act:active,.x:active,.timer:active{transform:translate(-50%,-50%) perspective(300px) rotateX(22deg) scale(.94)}
.act:active,.x:active,.timer:active{transform:scale(.94)}
.fastbtn{font-family:var(--disp);font-size:15px;padding:6px 14px;border-radius:999px;border:2px solid #ffd77a;background:#2a1d3c;color:#fff;cursor:pointer}
.fastbtn[aria-pressed="true"]{background:linear-gradient(180deg,#fff1b0,#e79a16);color:#3a1a00}
.big .lg{position:absolute;left:32%;right:32%;top:13%;aspect-ratio:1;border-radius:22%;display:grid;place-items:center;color:#fff;font-family:var(--disp);font-size:clamp(22px,3.6vw,38px);box-shadow:inset 0 -4px 0 rgba(0,0,0,.2)}
.big .nm{position:absolute;left:6%;right:6%;top:45%;text-align:center;font-family:var(--disp);font-size:clamp(13px,2vw,20px);line-height:1.05}
.big .back{background:
  repeating-linear-gradient(45deg,rgba(255,215,120,.35) 0 3px,transparent 3px 10px),
  repeating-linear-gradient(-45deg,rgba(255,215,120,.35) 0 3px,transparent 3px 10px),
  radial-gradient(circle at 50% 50%,#c3242f,#7a1018);border:4px solid #fff3dc;box-shadow:0 2px 0 rgba(0,0,0,.25),0 18px 22px rgba(0,0,0,.55);
  display:grid;place-items:center;color:#ffd77a;font-size:clamp(30px,5vw,54px);text-shadow:0 2px 0 #5a0a10}
.big .flap{pointer-events:none;border-radius:10px 10px 40% 40%/10px 10px 12px 12px!important;background:linear-gradient(90deg,rgba(0,0,0,.08),transparent 20% 80%,rgba(0,0,0,.08)),linear-gradient(0deg,#fffaf0 0%,#efe4cc 55%,#bfae86 100%);border:1px solid #c7b88f;box-shadow:0 -10px 16px rgba(0,0,0,.45);opacity:0}
.big .peek{position:absolute;left:0;right:0;height:6px;margin-bottom:-3px;border-radius:4px;opacity:0;z-index:3;pointer-events:none;transition:opacity .15s}
.big .peek[data-m="up"]{box-shadow:0 0 14px 6px rgba(61,255,138,.75)}.big .peek[data-m="dn"]{box-shadow:0 0 14px 6px rgba(255,90,74,.75)}
.big .peek[data-m="up"]{background:linear-gradient(90deg,transparent,#3dff8a,transparent)}
.big .peek[data-m="dn"]{background:linear-gradient(90deg,transparent,#ff5a4a,transparent)}
.big .peek[data-m="eq"],.big .peek[data-m="na"]{background:linear-gradient(90deg,transparent,#ffe9a8,transparent)}
.big .flap::after{content:"";position:absolute;left:0;right:0;bottom:-10px;height:10px;background:linear-gradient(rgba(0,0,0,.35),transparent)}
.hint{margin-top:4px;font-size:clamp(10px,1.25vw,12px);max-width:100%;overflow:hidden;text-overflow:ellipsis;color:#fff;background:rgba(10,20,12,.6);padding:.15em .6em;border-radius:999px;white-space:nowrap;text-shadow:0 1px 2px #000;min-height:1.3em}

<script>

  const C = '로로 팀 (Claude)', Sx = '슈슈 팀 (Codex)', SEASON = '2026-11-09';

  const active = T.agents.filter((a) => a.status === '현역');
  const bench = T.agents.filter((a) => String(a.status).startsWith('대기'));
  const has3d = (a) => (AV3D[a.avatar] ? 1 : 0);   // 3D 그림이 있는 캐릭터를 가운데(조명 아래) 쪽에
  const teamC = active.filter((a) => a.team === C), teamS = active.filter((a) => a.team === Sx);
  const toCenterRight = (xs) => [...xs].sort((x, y) => has3d(x) - has3d(y));   // 오른쪽 끝이 가운데에 가까울 때
  const toCenterLeft = (xs) => [...xs].sort((x, y) => has3d(y) - has3d(x));
  const toMiddle = (xs) => { const o = [...xs].sort((x, y) => has3d(y) - has3d(x)), r = new Array(o.length), idx = [2, 1, 3, 0, 4]; o.forEach((a, k) => (r[idx[k] ?? k] = a)); return r.filter(Boolean); };
  const picksOf = (a) => { const mine = T.picks.filter((p) => p.team === a.team && p.agent_id === a.agent_id); const live = mine.filter((p) => p.mode === '실전'); const pool = live.length ? live : mine; const last = pool.map((p) => p.round_date).sort().pop();
    return {KR: pool.find((p) => p.round_date === last && p.market === 'KR'), US: pool.find((p) => p.round_date === last && p.market === 'US'), last, mode: pool[0] && pool[0].mode}; };
  const pct = (v) => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(2);
  // 안 본 카드: 그 캐릭터의 최근 라운드를 이 기기에서 아직 다 열어 보지 않았으면 표시(기기에만 저장)
  const narrowPlate = () => innerWidth < 1000;   // 가로 휴대폰: 이름판이 좁아 '연습' 같은 머리말을 뺀다
  const store = (k, v) => { try { if (v === undefined) return JSON.parse(localStorage.getItem(k) || 'null'); localStorage.setItem(k, JSON.stringify(v)); } catch (e) { return null; } };
  const seenKey = (a) => `${a.team}|${a.agent_id}|${picksOf(a).last || ''}`;
  const isUnseen = (a) => { const pp = picksOf(a); if (!(pp.KR || pp.US)) return false; return !(store('league.seen') || []).includes(seenKey(a)); };
  const markSeen = (a) => { const s = store('league.seen') || []; const k = seenKey(a); if (!s.includes(k)) { s.push(k); store('league.seen', s.slice(-200)); } document.querySelectorAll('.plate').forEach((p) => { if (p.dataset.nick === a.nickname) p.classList.remove('unseen'); }); };
  const weekRow = (a) => (T.standings || []).filter((r) => r.team === a.team && r.agent_id === a.agent_id).sort((x, y) => (x.week < y.week ? 1 : -1))[0];
  const scoreOf = (a) => { const r = weekRow(a); if (r && r.avg != null) return {v: r.avg, tag: '이번 주'};
    const pp = picksOf(a), xs = ['KR', 'US'].map((k) => pp[k]).filter((p) => p && p.score != null && p.status === 'final'); if (!xs.length) return null;

  const chipSet = [['#d8262f', '#7a0f14'], ['#1f9a52', '#0c5a2c'], ['#2a6fd6', '#123a7a'], ['#f2c230', '#8a6414'], ['#f4f4f4', '#8a8a8a']];

    for (let j = 0; j < h; j++) { const c = document.createElement('div'); c.className = 'chip' + (blur ? ' blur' : ''); c.style.setProperty('--d', d + 'px'); c.style.setProperty('--c', chipSet[k][0]); c.style.setProperty('--e', chipSet[k][1]); c.style.top = (-j * d * .12) + 'px'; c.innerHTML = '<i></i>'; g.appendChild(c); }
    felt.appendChild(g); };

  // ── 로비: 가로는 10명 한 단, 세로는 슈슈(위)·로로(아래) 두 단 ──

      const u = (i + .5) / n, x = spec.x0 + u * spec.xw, off = Math.abs(u - .5) * 2, w = spec.w0 - off * spec.w1, s = scoreOf(a);

  };

  const md = (d) => { const [y, m, dd] = d.split('-').map(Number), w = new Date(Date.UTC(y, m - 1, dd)).getUTCDay(); return `${m}/${dd}(${'일월화수목금토'[w]})`; };   // 한국 날짜 그대로(보는 기기 시간대와 무관)

  if (elimWeek && !store('league.elim.' + elimWeek)) setTimeout(openElim, reduce ? 200 : 1600);
  window.__elim = openElim;
  window.__open = (nick) => open(active.find((a) => a.nickname === nick));
  window.__sheet = openSheet;
})();
</script>
</body></html>
